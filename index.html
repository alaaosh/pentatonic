<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentatonic Harmony Instrument</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <div id="audio-unlock" class="unlock-overlay">
        <div class="unlock-content">
            <h1>Pentatonic Synth</h1>
            <p>High-performance harmonic instrument</p>
            <button id="start-btn">Start Instrument</button>
        </div>
    </div>

    <div class="app-layout">
        <header class="top-bar">
            <div class="keypad-title-group">
                <h1 id="keypad-name">Pentatonic Synth</h1>
                <button id="rename-btn" class="rename-btn" title="Rename keypad" aria-label="Rename keypad">✏️</button>
                <input id="rename-input" class="rename-input hidden" type="text" maxlength="40" aria-label="Keypad name">
            </div>
            <div class="top-bar-controls">
                <!-- Camera Toggle -->
                <div class="control-group">
                    <label>Cam</label>
                    <button id="gesture-toggle" class="icon-btn-header" title="Toggle Camera Control">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="10" r="3" />
                            <circle cx="12" cy="10" r="7" />
                            <line x1="12" y1="17" x2="12" y2="22" />
                            <line x1="8" y1="22" x2="16" y2="22" />
                        </svg>
                    </button>
                </div>

                <!-- Master Volume (Vertical in Top Bar) -->
                <div class="control-group vol-group">
                    <label>Vol</label>
                    <div id="volume-slider" class="vertical-slider-container">
                        <div class="slider-track vertical">
                            <div id="volume-fill" class="slider-fill"></div>
                        </div>
                        <div id="volume-handle" class="slider-handle-v"></div>
                    </div>
                </div>

                <div class="control-divider vertical"></div>

                <!-- Tone Shaping Section (Wave + Dials) -->
                <div class="tone-shaping-group">
                    <div class="control-group">
                        <label>Wave</label>
                        <div id="waveform-select" class="segmented-control">
                            <button class="segment-btn active" data-value="sawtooth">Saw</button>
                            <button class="segment-btn" data-value="square">Sqr</button>
                            <button class="segment-btn" data-value="triangle">Tri</button>
                            <button class="segment-btn" data-value="sine">Sin</button>
                        </div>
                    </div>

                    <div class="control-divider vertical inner-divider"></div>

                    <!-- Synth Dials -->
                    <div class="synth-dials-row">
                        <div class="control-group">
                            <label>Filter</label>
                            <div id="dial-filter" class="dial-container"></div>
                        </div>
                        <div class="control-group">
                            <label>Res</label>
                            <div id="dial-resonance" class="dial-container"></div>
                        </div>
                        <div class="control-group">
                            <label>Atk</label>
                            <div id="dial-attack" class="dial-container"></div>
                        </div>
                        <div class="control-group">
                            <label>Dec</label>
                            <div id="dial-decay" class="dial-container"></div>
                        </div>
                        <div class="control-group">
                            <label>Sus</label>
                            <div id="dial-sustain" class="dial-container"></div>
                        </div>
                        <div class="control-group">
                            <label>Rel</label>
                            <div id="dial-release" class="dial-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <aside class="sidebar sidebar-left">
            <div class="control-group">
                <label>Root Note</label>
                <div id="root-strip" class="root-grid">
                    <button class="root-btn active" data-value="C">C</button>
                    <button class="root-btn" data-value="C#">C#</button>
                    <button class="root-btn" data-value="D">D</button>
                    <button class="root-btn" data-value="D#">D#</button>
                    <button class="root-btn" data-value="E">E</button>
                    <button class="root-btn" data-value="F">F</button>
                    <button class="root-btn" data-value="F#">F#</button>
                    <button class="root-btn" data-value="G">G</button>
                    <button class="root-btn" data-value="G#">G#</button>
                    <button class="root-btn" data-value="A">A</button>
                    <button class="root-btn" data-value="A#">A#</button>
                    <button class="root-btn" data-value="B">B</button>
                </div>
            </div>

            <div class="control-group">
                <label>Scale Type</label>
                <select id="scale-select" class="modern-select">
                    <option value="major">Major Pentatonic</option>
                    <option value="minor">Minor Pentatonic</option>
                    <option value="blues">Blues</option>
                    <option value="yo">Yo (Japanese)</option>
                    <option value="hirajoshi">Hirajoshi</option>
                </select>
            </div>
        </aside>

        <main class="main-content">
            <canvas id="instrument" 
                tabindex="0" 
                role="application" 
                aria-label="Pentatonic Musical Instrument" 
                aria-description="Play five pentatonic notes using touch, mouse, or keys A, S, D, F, and G."></canvas>
            
            <div id="note-display" aria-live="polite">Touch to play</div>
            
            <!-- Gesture Control Panel -->
            <div id="gesture-panel" class="gesture-panel hidden">
                <div class="gesture-header">
                    <h3>Camera Gesture Control</h3>
                    <div class="gesture-actions">
                        <label class="icon-btn" title="Upload Video">
                            📁 <input type="file" id="video-upload" accept="video/*" hidden>
                        </label>
                        <button id="gesture-close" class="gesture-close-btn">×</button>
                    </div>
                </div>
                <video id="gesture-video" class="gesture-video" autoplay playsinline controls></video>
                <canvas id="gesture-canvas" class="gesture-canvas"></canvas>
                <div class="gesture-info">
                    <p><strong>Air Piano Mode</strong></p>
                    <p>🖐 Left Hand = Bass | Right Hand = Melody</p>
                    <p>👇 Bend any finger to play a note</p>
                    <p>↕️ Move bent finger up/down to bend pitch</p>
                    <p>✊ Make a fist to stop sound</p>
                </div>
            </div>
            
            <!-- Gesture Control Panel -->
        </main>

        <aside class="sidebar sidebar-right">
            <div class="control-group">
                <label>Harmony Mode</label>
                <div id="harmony-mode" class="segmented-control vertical">
                    <button class="segment-btn" data-value="none">Single</button>
                    <button class="segment-btn active" data-value="chord">Chord</button>
                    <button class="segment-btn" data-value="power">Power</button>
                    <button class="segment-btn" data-value="arpeggio">Arp</button>
                </div>
            </div>

            <div class="control-group">
                <label>Chord Type</label>
                <select id="chord-type" class="modern-select">
                    <option value="maj7">Major 7th</option>
                    <option value="min7">Minor 7th</option>
                    <option value="dom7">Dominant 7th</option>
                    <option value="maj9">Major 9th</option>
                    <option value="min9">Minor 9th</option>
                    <option value="sus4">Suspended 4th</option>
                    <option value="dim7">Diminished 7th</option>
                </select>
            </div>

            <div class="control-divider"></div>

            <div class="control-group">
                <label>Octave Range</label>
                <div id="octave-slider" class="multi-range-slider">
                    <div class="slider-track"></div>
                    <div class="slider-handle bottom" data-key="bottom" title="Bottom Octave"></div>
                    <div class="slider-handle mid" data-key="mid" title="Middle Octave"></div>
                    <div class="slider-handle top" data-key="top" title="Top Octave"></div>
                </div>
            </div>
        </aside>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
