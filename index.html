<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PentaSynth v2</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <div id="audio-unlock" class="unlock-overlay">
        <div class="unlock-content">
            <h1>PentaSynth</h1>
            <p>Algorithmic Pentatonic Synthesizer</p>
            <button id="start-btn">Start</button>
        </div>
    </div>

    <div class="app-layout">
        <header class="top-bar">
            <div class="top-bar-controls">
                <!-- Camera Toggle -->
                <div class="control-group">
                    <button id="gesture-toggle" class="icon-btn-header" title="Toggle Camera Control">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="10" r="3" />
                            <circle cx="12" cy="10" r="7" />
                            <line x1="12" y1="17" x2="12" y2="22" />
                            <line x1="8" y1="22" x2="16" y2="22" />
                        </svg>
                    </button>
                </div>

                <!-- Master Volume -->
                <div class="control-group vol-group">
                    <label>Vol</label>
                    <div id="volume-slider" class="vertical-slider-container">
                        <div class="slider-track vertical">
                            <div id="volume-fill" class="slider-fill"></div>
                        </div>
                        <div id="volume-handle" class="slider-handle-v"></div>
                    </div>
                </div>

                <div class="control-divider vertical"></div>

                <!-- Scale Selection (compact) -->
                <div class="control-group">
                    <label>Root</label>
                    <div id="root-strip" class="root-strip-compact">
                        <button class="root-btn active" data-value="C">C</button>
                        <button class="root-btn" data-value="C#">C#</button>
                        <button class="root-btn" data-value="D">D</button>
                        <button class="root-btn" data-value="D#">D#</button>
                        <button class="root-btn" data-value="E">E</button>
                        <button class="root-btn" data-value="F">F</button>
                        <button class="root-btn" data-value="F#">F#</button>
                        <button class="root-btn" data-value="G">G</button>
                        <button class="root-btn" data-value="G#">G#</button>
                        <button class="root-btn" data-value="A">A</button>
                        <button class="root-btn" data-value="A#">A#</button>
                        <button class="root-btn" data-value="B">B</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Scale</label>
                    <select id="scale-select" class="modern-select compact-select">
                        <option value="major">Major</option>
                        <option value="minor">Minor</option>
                        <option value="blues">Blues</option>
                        <option value="yo">Yo</option>
                        <option value="hirajoshi">Hirajoshi</option>
                    </select>
                </div>
            </div>
        </header>

        <aside class="sidebar sidebar-left">
            <!-- The Complexity Dial — the single most important control -->
            <div id="complexity-dial-container" class="complexity-dial-wrapper"></div>

            <div class="control-group">
                <label>Octave Range</label>
                <div id="octave-slider" class="multi-range-slider">
                    <div class="slider-track"></div>
                    <div class="slider-handle bottom" data-key="bottom" title="Bottom Octave"></div>
                    <div class="slider-handle mid" data-key="mid" title="Middle Octave"></div>
                    <div class="slider-handle top" data-key="top" title="Top Octave"></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <canvas id="instrument" 
                tabindex="0" 
                role="application" 
                aria-label="Pentatonic Musical Instrument" 
                aria-description="Play five pentatonic notes using touch, mouse, or keys Q-T (top), A-G (mid), Z-B (bottom)."></canvas>
            
            <div id="note-display" aria-live="polite"></div>
            
            <!-- Gesture Control Panel -->
            <div id="gesture-panel" class="gesture-panel hidden">
                <div class="gesture-header">
                    <h3>Air Piano</h3>
                    <div class="gesture-actions">
                        <label class="icon-btn" title="Upload Video">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <input type="file" id="video-upload" accept="video/*" hidden>
                        </label>
                        <button id="gesture-close" class="gesture-close-btn">&times;</button>
                    </div>
                </div>
                <video id="gesture-video" class="gesture-video" autoplay playsinline controls></video>
                <canvas id="gesture-canvas" class="gesture-canvas"></canvas>
                <div class="gesture-info">
                    <p><strong>Air Piano Mode</strong></p>
                    <p>Left Hand = Bass | Right Hand = Melody</p>
                    <p>Bend finger = play | Straighten = stop</p>
                    <p>Move up/down = pitch bend</p>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
